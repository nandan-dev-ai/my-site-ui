name: CICD 
on:
  push: 
    branches: 
      - master
jobs:
  build-and-deploy:
    runs-on: [ubuntu-latest]
    steps:
      - name: Checkout Source
        uses: actions/checkout@v4
      - name: Setup Node
        uses: actions/setup-node@v4
      - name: Install Dependencies
        run: npm install
      - name: Generate Package
        run: zip -r nodejs-app-build.zip .
      - name: Check AWS credentials are configured
        env:
          AWS_ACCESS_KEY_ID: ${{ secrets.AWS_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
        run: |
          test -n "$AWS_ACCESS_KEY_ID" || { echo "AWS_ACCESS_KEY_ID is not configured."; exit 1; }
          test -n "$AWS_SECRET_ACCESS_KEY" || { echo "AWS_SECRET_ACCESS_KEY is not configured."; exit 1; }
          if [ "${#AWS_ACCESS_KEY_ID}" -eq 40 ] && [ "${#AWS_SECRET_ACCESS_KEY}" -eq 20 ]; then
            echo "AWS credentials appear to be swapped: access keys are usually 20 characters and secret keys are 40 characters."
            exit 1
          fi
          aws sts get-caller-identity
      - name: Deploy to EB
        uses: einaregilsson/beanstalk-deploy@v21
        with:
          aws_access_key: ${{secrets.AWS_SECRET_ACCESS_KEY}}
          aws_secret_key: ${{secrets.AWS_ACCESS_KEY_ID}}
          application_name: 'Resume'
          environment_name: 'Resume-env'
          version_label: ${{github.sha}}
          region: us-west-2
          deployment_package: 'nodejs-app-build.zip'
        
      
    
    
