name: CICD 
on:
  push: 
    branches: 
      - master
jobs:
  build-and-deploy:
    runs-on: [ubuntu-latest]
    steps:
      - name: Checkout Source
        uses: actions/checkout@v4
      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10.33.2
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 24
      - name: Install Dependencies
        run: pnpm install --frozen-lockfile
      - name: Build Next.js application
        run: pnpm build
      - name: Generate Package
        run: |
          mkdir -p apps/web/.next/standalone/apps/web/.next
          cp -r apps/web/public apps/web/.next/standalone/apps/web/public
          cp -r apps/web/.next/static apps/web/.next/standalone/apps/web/.next/static
          cp apps/web/Procfile apps/web/.next/standalone/Procfile
          cd apps/web/.next/standalone
          zip -r ../../../nodejs-app-build.zip . \
            -x "*.git*" \
            -x ".github/*" \
            -x ".env" \
            -x ".env.*"
      - name: Deploy to EB
        uses: einaregilsson/beanstalk-deploy@v21
        with:
          aws_access_key: ${{secrets.AWS_ACCESS_KEY_ID}}
          aws_secret_key: ${{secrets.AWS_SECRET_ACCESS_KEY}}
          application_name: 'Resume'
          environment_name: 'Resume-env'
          version_label: ${{github.sha}}
          region: us-east-1
          deployment_package: 'apps/web/nodejs-app-build.zip'
        
      
    
    
